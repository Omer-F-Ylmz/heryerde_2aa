# Prod şablonu. Gizli değerler ortamdan gelir (.env dosyası veya CI secret):
#   HERYERDE_DB_PASSWORD, HERYERDE_CONNECTION_STRING, HERYERDE_ADMIN_EMAIL, HERYERDE_ADMIN_PASSWORD,
#   HERYERDE_BASE_URL (canonical/OG/sitemap kökü, ör. https://alanadi.com)
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: heryerde-web:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${HERYERDE_CONNECTION_STRING:?HERYERDE_CONNECTION_STRING gerekli}
      Admin__Email: ${HERYERDE_ADMIN_EMAIL:?HERYERDE_ADMIN_EMAIL gerekli}
      Admin__Password: ${HERYERDE_ADMIN_PASSWORD:?HERYERDE_ADMIN_PASSWORD gerekli}
      Shop__BaseUrl: ${HERYERDE_BASE_URL:?HERYERDE_BASE_URL gerekli}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${HERYERDE_DB_PASSWORD:?HERYERDE_DB_PASSWORD gerekli}
    volumes:
      - heryerde-mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  heryerde-mssql:
