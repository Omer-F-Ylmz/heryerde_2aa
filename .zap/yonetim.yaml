# Yönetim paneli taraması (Automation Framework). zap-baseline/full-scan hedefi köke kırptığı için bağlam /admin ile
# başlatılamıyordu; plan örümceği doğrudan /admin/products'tan başlatır. Oturum çerezi zap.sh'a -config replacer ile verilir.
env:
  contexts:
    - name: yonetim
      urls:
        - http://localhost:8080/admin/products
      includePaths:
        - "http://localhost:8080/admin.*"
      excludePaths:
        - "http://localhost:8080/admin/auth/logout.*"
        - "http://localhost:8080/admin/sifre.*"
        - "http://localhost:8080/admin/oturumlar.*"
        - "http://localhost:8080/admin/iki-adim.*"
        - "http://localhost:8080/admin/.*[Dd]elete.*"
        - "http://localhost:8080/admin/orders/anonymize.*"
        - "http://localhost:8080/admin/orders/[0-9]+/iade.*"
        - "http://localhost:8080/admin/kvkk/anonimlestir.*"
        - "http://localhost:8080/admin/kvkk/basvuru/[0-9]+/tamamla.*"
        - "http://localhost:8080/admin/orders/[0-9]+/geri-odendi.*"
        - "http://localhost:8080/admin/iadeler/[0-9]+/(onayla|reddet|teslim-al|geri-odendi).*"
        # D14/D15: silme uçları Türkçe ("sil"), yukarıdaki [Dd]elete kalıbına girmiyor.
        - "http://localhost:8080/admin/duyurular/[0-9]+/sil.*"
        - "http://localhost:8080/admin/kuponlar/[0-9]+/sil.*"
        - "http://localhost:8080/admin/ceyizlistesi/[0-9]+/sil.*"
        - "http://localhost:8080/admin/markalar/[0-9]+/sil.*"
    # D15: .zap/d15-tohum.sh'nin ürünü ve çeyiz listesiyle öneri ucu, süzgeçli liste, çeyiz sayfaları ve ürün video formu.
    - name: d15
      urls:
        - http://localhost:8080/ara/oner?q=tencere
        - http://localhost:8080/ev?marka=karaca&oz=Malzeme:D%C3%B6k%C3%BCm&stok=1
        - http://localhost:8080/ceyizlistesi/yeni
        - http://localhost:8080/ceyizlistesi/zaptarama1
        - http://localhost:8080/ceyizlistesi/yonet?t=0d15a000-0000-4000-8000-00000000d15a
        - http://localhost:8080/admin/products/edit/1
      includePaths:
        - "http://localhost:8080/ara/oner.*"
        - "http://localhost:8080/ev[?].*"
        - "http://localhost:8080/ceyizlistesi.*"
        - "(?i)http://localhost:8080/admin/products/(edit/1|addvideo).*"
      excludePaths:
        # Listeden kalem silmek taranacak yüzeyi boşaltır.
        - "http://localhost:8080/ceyizlistesi/yonet/sil.*"
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  # Doğrulanmış yanlış pozitif (docs/zap-3.md): 6-5 "URL dosya adı parametre değeri" sezgisi, int Id/SortOrder'da formun
  # 200/302/400 dalgalanmasıyla tetikleniyor; değer dosya yoluna ulaşmıyor, yanıtta dosya içeriği yok.
  - type: alertFilter
    alertFilters:
      - ruleId: 6
        newRisk: "False Positive"
        url: "http://localhost:8080/admin/categories/edit/[0-9]+"
        urlRegex: true
        parameter: "Id|SortOrder"
        parameterRegex: true
      # D15: aynı 6-5 sezgisi ürün ve marka formlarında (saldırı değeri adresin son parçası "1"/"edit"/"yeni", kanıt boş).
      # Alanlar EF güncellemesine gider; dosya yolları yalnız int kimlik + GUID'den kurulur (ProductImageStorage), formdan değil.
      - ruleId: 6
        newRisk: "False Positive"
        url: "http://localhost:8080/admin/(products/edit(/[0-9]+)?|markalar/yeni)"
        urlRegex: true
        parameter: "Id|Name|BrandId|CategoryId|CampaignPrice|FeaturedOrder|GiftMode|GiftProductId|GiftQty|Stock|VariantAxis1Label|VariantAxis2Label"
        parameterRegex: true

  # D15 yüzeyleri önce ve kendi süresiyle: yönetim aktif taraması 40 dk tavanına ulaşıyor.
  - type: requestor
    requests:
      - url: http://localhost:8080/ara/oner?q=tencere
      - url: http://localhost:8080/ev?marka=karaca&oz=Malzeme:D%C3%B6k%C3%BCm&stok=1
      - url: http://localhost:8080/ceyizlistesi/yeni
      - url: http://localhost:8080/ceyizlistesi/zaptarama1
      - url: http://localhost:8080/ceyizlistesi/yonet?t=0d15a000-0000-4000-8000-00000000d15a
      - url: http://localhost:8080/admin/products/edit/1

  - type: spider
    parameters:
      context: d15
      url: http://localhost:8080/ceyizlistesi/zaptarama1
      maxDuration: 2

  - type: activeScan
    parameters:
      context: d15
      maxScanDurationInMins: 15

  - type: spider
    parameters:
      context: yonetim
      url: http://localhost:8080/admin/products
      maxDuration: 5

  - type: passiveScan-wait
    parameters:
      maxDuration: 10

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: yonetim-baseline

  - type: activeScan
    parameters:
      context: yonetim
      maxScanDurationInMins: 40

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: yonetim-full

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: yonetim-full
