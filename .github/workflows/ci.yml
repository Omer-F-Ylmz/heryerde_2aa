name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Her pazartesi 06:00 UTC: yeni yayımlanan güvenlik açıkları için haftalık tarama.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Smoke hedefi (bos birakilirsa compose ile yerel prod imaji)"
        required: false
        default: ""

# docker-compose.prod.yml'in zorunlu değişkenleri (docs/dis-hesaplar.md); zap-scan, restore-check ve smoke aynı değerlerle kalkar.
env:
  HERYERDE_DB_PASSWORD: "HerYerde_Zap_P4ssw0rd!"
  HERYERDE_CONNECTION_STRING: "Server=db;Database=HerYerde;User Id=sa;Password=HerYerde_Zap_P4ssw0rd!;TrustServerCertificate=True"
  HERYERDE_ADMIN_EMAIL: "zap@heryerde.local"
  HERYERDE_ADMIN_PASSWORD: "Zap-Tarama-Parola-2026"
  HERYERDE_BASE_URL: "http://localhost:8080"
  HERYERDE_ALLOWED_HOSTS: "localhost"
  HERYERDE_IBAN: "TR00 0000 0000 0000 0000 0000 00"
  HERYERDE_SMTP_HOST: "smtp.invalid"
  HERYERDE_SMTP_USER: "ci"
  HERYERDE_SMTP_PASSWORD: "ci"
  HERYERDE_SMTP_FROM: "siparis@heryerde.local"
  HERYERDE_STORE_EMAIL: "magaza@heryerde.local"
  HERYERDE_IYZICO_API_KEY: "ci-sahte-anahtar"
  HERYERDE_IYZICO_SECRET_KEY: "ci-sahte-gizli"
  HERYERDE_IYZICO_BASE_URL: "https://sandbox-api.iyzipay.com"
  HERYERDE_IYZICO_CSP_SOURCE: "https://sandbox-api.iyzipay.com"
  HERYERDE_SENTRY_DSN: "https://ci@sentry.invalid/1"

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "HerYerde_Ci_P4ssw0rd!"
        ports:
          - 1433:1433
        # Yedek testleri: BACKUP DATABASE konteynerin diskine yazar, test aynı yoldan okur.
        volumes:
          - /tmp/heryerde-yedek:/tmp/heryerde-yedek
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'HerYerde_Ci_P4ssw0rd!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      ConnectionStrings__Default: "Server=localhost,1433;Database=HerYerdeTest;User Id=sa;Password=HerYerde_Ci_P4ssw0rd!;TrustServerCertificate=True"
      HERYERDE_TEST_BACKUP_DIR: /tmp/heryerde-yedek

    steps:
      - uses: actions/checkout@v4

      - name: Workflow lint
        # actionlint (shellcheck dahil): ci.yml ve deploy.yml söz dizimi, ifade ve betik denetimi.
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Backup folder permissions
        # Klasörü docker root olarak açar; mssql (10001) ve runner kullanıcısı birlikte yazar.
        run: docker exec -u 0 ${{ job.services.sqlserver.id }} chmod 777 /tmp/heryerde-yedek

      - name: Compose required env
        # Zorunlu değişkenlerden biri boşken prod compose yorumlanamaz; hepsi doluyken yorumlanır.
        run: |
          if env -i PATH="$PATH" HOME="$HOME" docker compose -f docker-compose.prod.yml config > /dev/null 2> missing.txt; then
            echo "::error::Zorunlu env boşken docker compose config başarılı oldu."; exit 1
          fi
          grep -q "gerekli" missing.txt
          for name in HERYERDE_SENTRY_DSN HERYERDE_IYZICO_API_KEY HERYERDE_SMTP_HOST HERYERDE_ALLOWED_HOSTS HERYERDE_BASE_URL; do
            if env -u "$name" docker compose -f docker-compose.prod.yml config > /dev/null 2>&1; then
              echo "::error::$name eksikken docker compose config başarılı oldu."; exit 1
            fi
          done
          docker compose -f docker-compose.prod.yml config > /dev/null

      - name: FFmpeg
        # Ürün videosu yükleme testleri gerçek ffmpeg/ffprobe ile koşar (D15 A1).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Restore
        run: dotnet restore HerYerde.sln

      - name: Build CSS
        run: |
          npm ci --ignore-scripts
          npm run css:build

      - name: Build
        run: dotnet build HerYerde.sln --no-restore -c Release -warnaserror

      - name: Test
        # Tarayici testleri Chrome indirir; onlari browser-check job'u kosar.
        run: dotnet test HerYerde.sln --no-build -c Release --filter "Category!=Browser" --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  browser-check:
    # Chrome indirmesi yalniz burada: haftalik schedule ve elle tetik (Actions > CI > Run workflow).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "HerYerde_Ci_P4ssw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'HerYerde_Ci_P4ssw0rd!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      ConnectionStrings__Default: "Server=localhost,1433;Database=HerYerdeTest;User Id=sa;Password=HerYerde_Ci_P4ssw0rd!;TrustServerCertificate=True"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: FFmpeg
        # Ürün videosu yükleme testleri gerçek ffmpeg/ffprobe ile koşar (D15 A1).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Restore
        run: dotnet restore HerYerde.sln

      - name: Build CSS
        run: |
          npm ci --ignore-scripts
          npm run css:build

      - name: Build
        run: dotnet build HerYerde.sln --no-restore -c Release -warnaserror

      - name: Browser tests
        run: dotnet test HerYerde.sln --no-build -c Release --filter "Category=Browser"

  security-scan:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore
        run: dotnet restore HerYerde.sln

      - name: NuGet vulnerability scan
        # JSON çıktısı: CLI metni değişse de açık ya da proje sorunu (ör. restore yok) sayılır; filtre önce bilinen
        # açıklı örnekte denenir, bulamazsa adım kırmızı olur (sessiz yeşil yok).
        run: |
          filter='[(.problems // [])[], (.projects[] | (.problems // [])[]), (.projects[] | (.frameworks // [])[] | ((.topLevelPackages // [])[], (.transitivePackages // [])[]) | select(has("vulnerabilities")))] | length'
          sample='{"projects":[{"frameworks":[{"transitivePackages":[{"id":"Ornek","vulnerabilities":[{"severity":"High"}]}]}]}]}'
          test "$(jq "$filter" <<<"$sample")" -eq 1
          dotnet list HerYerde.sln package --vulnerable --include-transitive --format json | tee vulnerable.json
          jq -e '.projects | length > 0' vulnerable.json > /dev/null
          if [ "$(jq "$filter" vulnerable.json)" -ne 0 ]; then
            echo "::error::Güvenlik açığı olan NuGet paketi ya da tarama sorunu bulundu."
            exit 1
          fi

      - name: npm audit
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

  zap-scan:
    # DAST: prod imajı compose ile ayağa kalkar, ZAP vitrini baseline tarar; tarama hesabıyla yönetim paneli oturumlu taranır
    # (aktif tarama 40 dk tavan). Doğrulanmış yanlış pozitif dışındaki Medium+ bulguda kırmızı (bkz. docs/zap-1.md, docs/zap-3.md).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 110

    env:
      COMPOSE: docker compose -f docker-compose.prod.yml -f docker-compose.zap.yml

    steps:
      - uses: actions/checkout@v4

      - name: Draft content (CI)
        # Yer tutucu kapısı: taslak metin örnek değerle doldurulur, imaj sınanır (tools/ci-taslak-doldur.sh; yayında yok).
        run: bash tools/ci-taslak-doldur.sh

      - name: Start app (compose)
        # --wait web konteynerinin sağlık denetimini (dotnet --healthcheck) de bekler; sağlıksızsa kırmızı.
        run: |
          $COMPOSE up -d --build --wait --wait-timeout 300 || { $COMPOSE logs web; exit 1; }
          curl -fsS http://localhost:8080/health

      - name: Sample data (D15 yüzeyleri)
        # Prod'da katalog tohumu yok: tek ürün (--ithal), marka + özellik ve bilinen adresli çeyiz listesi; yönetim planının d15
        # bağlamı (15 dk) öneri ucunu, süzgeçli listeyi, çeyiz sayfalarını ve ürün video formunu tarar.
        run: |
          bash tools/ci-ornek-veri.sh
          bash .zap/d15-tohum.sh

      - name: ZAP baseline
        # -a alfa pasif kurallar, -j ajax spider; uyarılar çıkış kodunu bozmaz, eşik bir sonraki adımda.
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 -r zap-report.html -J zap.json -a -j -I

      - name: ZAP admin (authenticated)
        # Compose'un tohumladığı 2FA'sız tarama hesabı; çerez replacer ile her isteğe eklenir. Plan .zap/yonetim.yaml: örümcek, pasif,
        # aktif tarama (40 dk), yıkıcı uçlar (çıkış, parola, silme, anonimleştirme, iade) dışarıda. Çıkış kodu 2 = uyarı, eşik sonraki adımda.
        # D16: aynı Cookie başlığına doğrulanmış tarama üyesinin oturumu eklenir (/admin yönetici, diğer yollar üye çerezini okur).
        run: |
          cp .zap/yonetim.yaml zap-out/
          admin="$(bash .zap/yonetim-cerezi.sh http://localhost:8080 "$HERYERDE_ADMIN_EMAIL" "$HERYERDE_ADMIN_PASSWORD")"
          uye="$(bash .zap/uye-cerezi.sh http://localhost:8080 zap-uye@example.com "$HERYERDE_ADMIN_PASSWORD")"
          echo "::add-mask::$admin"
          echo "::add-mask::$uye"
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -port 8090 -config "replacer.full_list(0).description=yonetim" -config "replacer.full_list(0).enabled=true" \
            -config "replacer.full_list(0).matchtype=REQ_HEADER" -config "replacer.full_list(0).matchstr=Cookie" -config "replacer.full_list(0).regex=false" \
            -config "replacer.full_list(0).replacement=$admin;$uye" -autorun /zap/wrk/yonetim.yaml || [ $? -eq 2 ]
          # Oturumlu tarandığının kanıtı: menüdeki rapor ve yorumlar sayfaları 200 dönmüş olmalı (giriş betikleri bu sayfalara gitmez).
          $COMPOSE logs web > zap-out/web.log 2>&1
          grep -q 'GET /admin/rapor responded 200' zap-out/web.log || { echo "::error::Yönetim taraması oturumsuz kaldı."; exit 1; }
          grep -q 'GET /hesap/yorumlar responded 200' zap-out/web.log || { echo "::error::Üye taraması oturumsuz kaldı."; exit 1; }
          # Tarama bitince üye çerezi hâlâ geçerli olmalı: oturumu düşüren bir uç (tüm oturumları kapat, parola) gönderilmemiş.
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "Cookie: $uye" http://localhost:8080/hesap/yorumlar)"
          [ "$code" = "200" ] || { echo "::error::Üye oturumu tarama sırasında düştü ($code)."; exit 1; }
          test -f zap-out/yonetim-full.json || { echo "::error::yonetim-full.json yok."; exit 1; }

      - name: Fail on Medium+
        # Planda doğrulanıp "False Positive" işaretlenen uyarı (docs/zap-3.md, 6-5 Path Traversal) eşiğe girmez.
        run: |
          for f in zap-out/zap.json zap-out/yonetim-full.json; do
            jq -r '.site[] | select(."@name" | startswith("http://localhost")) | .alerts[]
              | select((.riskcode|tonumber) >= 2) | select(.riskdesc | contains("False Positive") | not)
              | "::error::\(.riskdesc) \(.name) (\(.pluginid))"' "$f"
          done | tee medium.txt
          test ! -s medium.txt

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-out/

  restore-check:
    # Haftalık yedek provası (docs/yedekleme.md): prod imajı kalkar, örnek veri --ithal ile imajda girer, gece yedeği elle
    # tetiklenir, son .bak ayrı veritabanına açılır; ürün sayısı eşit ve o veritabanıyla açılan uygulama /health/ready 200.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    env:
      COMPOSE: docker compose -f docker-compose.prod.yml

    steps:
      - uses: actions/checkout@v4

      - name: Draft content (CI)
        # Yer tutucu kapısı: taslak metin örnek değerle doldurulur, imaj sınanır (tools/ci-taslak-doldur.sh; yayında yok).
        run: bash tools/ci-taslak-doldur.sh

      - name: Start app (compose)
        run: |
          sudo install -d -m 0770 -o 10001 -g 1654 backups
          $COMPOSE up -d --build --wait --wait-timeout 300 || { $COMPOSE logs web; exit 1; }
          curl -fsS http://localhost:8080/health/ready

      - name: Sample data (--ithal, --gorsel-yenile in image)
        run: bash tools/ci-ornek-veri.sh

      - name: Backup (--yedek-al)
        run: |
          $COMPOSE run --rm backup "dotnet HerYerde.Web.dll --yedek-al /backups"
          sudo ls -l backups
          latest=$(sudo ls -1 backups | grep '\.bak$' | sort | tail -1)
          archive=$(sudo ls -1 backups | grep '^uploads-.*\.tar\.gz$' | sort | tail -1)
          test -n "$latest" && test -n "$archive"
          sudo tar -tzf "backups/$archive" | grep -q 'products/'
          echo "LATEST_BACKUP=$latest" >> "$GITHUB_ENV"

      - name: Restore (--yedek-yukle)
        run: $COMPOSE run --rm backup "dotnet HerYerde.Web.dll --yedek-yukle /backups/$LATEST_BACKUP"

      - name: Verify restored database
        run: |
          count() {
            $COMPOSE exec -T db /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$HERYERDE_DB_PASSWORD" -C -b -h -1 -W \
              -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM [$1].dbo.product" | tr -d '[:space:]'
          }
          live=$(count HerYerde)
          restored=$(count HerYerde_prova)
          echo "canli=$live prova=$restored"
          test "$live" -ge 1 && test "$live" = "$restored"
          $COMPOSE run -d --name heryerde-prova -p 8081:8080 \
            -e "ConnectionStrings__Default=${HERYERDE_CONNECTION_STRING/Database=HerYerde;/Database=HerYerde_prova;}" web
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8081/health/ready; then exit 0; fi
            sleep 2
          done
          docker logs heryerde-prova
          exit 1

  smoke:
    # tools/smoke.ps1: base_url verilirse o adrese (yayın sonrası), verilmezse compose ile kalkan prod imajına karşı.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    env:
      COMPOSE: docker compose -f docker-compose.prod.yml
      SMOKE_BASE_URL: ${{ inputs.base_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Draft content (CI)
        # Yer tutucu kapısı: taslak metin örnek değerle doldurulur, imaj sınanır (tools/ci-taslak-doldur.sh; yayında yok).
        if: env.SMOKE_BASE_URL == ''
        run: bash tools/ci-taslak-doldur.sh

      - name: Start app (compose)
        if: env.SMOKE_BASE_URL == ''
        run: |
          $COMPOSE up -d --build --wait --wait-timeout 300 || { $COMPOSE logs web; exit 1; }
          bash tools/ci-ornek-veri.sh

      - name: Smoke
        shell: pwsh
        run: |
          $target = if ($env:SMOKE_BASE_URL) { $env:SMOKE_BASE_URL } else { 'http://localhost:8080' }
          ./tools/smoke.ps1 -BaseUrl $target
