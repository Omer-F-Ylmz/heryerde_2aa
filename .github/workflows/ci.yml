name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Her pazartesi 06:00 UTC: yeni yayımlanan güvenlik açıkları için haftalık tarama.
    - cron: "0 6 * * 1"

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "HerYerde_Ci_P4ssw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'HerYerde_Ci_P4ssw0rd!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      ConnectionStrings__Default: "Server=localhost,1433;Database=HerYerdeTest;User Id=sa;Password=HerYerde_Ci_P4ssw0rd!;TrustServerCertificate=True"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore
        run: dotnet restore HerYerde.sln

      - name: Build CSS
        run: |
          npm ci --ignore-scripts
          npm run css:build

      - name: Build
        run: dotnet build HerYerde.sln --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test HerYerde.sln --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  security-scan:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Bulgu metnini dilden bagimsiz kilmak icin CLI ciktisi Ingilizce.
      DOTNET_CLI_UI_LANGUAGE: "en"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore
        run: dotnet restore HerYerde.sln

      - name: NuGet vulnerability scan
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Güvenlik açığı olan NuGet paketi bulundu."
            exit 1
          fi

      - name: npm audit
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
